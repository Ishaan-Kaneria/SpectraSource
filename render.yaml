# One-click backend hosting on Render (free plan).
# Render dashboard > New > Blueprint > pick this repo. It asks for LLM_API_KEY.
# The free plan sleeps after 15 idle minutes (first request then takes ~1 min)
# and its disk resets on redeploy, so job history is not permanent.
services:
  - type: web
    name: spectrasource-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://specrtrasource.netlify.app,http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+--)?specrtrasource\.netlify\.app
